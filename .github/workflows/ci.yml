name: CI

# ------------------------------------------------------------------------------------------
# 최소 CI 워크플로우 (barofit 백엔드 서비스 공통 템플릿)
#
# 지금 여기서 하는 일: PR이 dev로 들어올 때 포맷(spotlessCheck)과 단위 테스트(test)만 돌린다.
# integrationTest(Testcontainers)는 아직 포함하지 않았다 — 의도적으로 "최소" 범위로 남겨뒀다.
# CI/CD를 맡을 팀원이 아래 TODO들을 보고 필요한 순서대로 확장하면 된다.
# ------------------------------------------------------------------------------------------

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 이 서비스 레포 checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------------------
      # barofit-common 임시 체크아웃 + publishToMavenLocal
      #
      # 이 서비스의 build.gradle은 repositories { mavenLocal() }로 barofit-common을 참조한다.
      # barofit-common이 아직 GitHub Packages 같은 원격 레지스트리에 배포되지 않고 있어서,
      # CI 러너(매번 새로 뜨는, 비어 있는 mavenLocal)에서도 빌드가 되려면 실행마다 common을
      # 직접 받아 publishToMavenLocal로 올려줘야 한다. 로컬 개발자가 작업 시작 전에 하는
      # "barofit-common에서 publishToMavenLocal 먼저" 절차를 CI에서 그대로 흉내낸 임시방편이다.
      #
      # TODO(CICD 담당자): barofit-common이 GitHub Packages로 배포되기 시작하면
      #   1) 아래 "barofit-common checkout" + "barofit-common publishToMavenLocal" 두 스텝을 삭제
      #   2) 이 서비스의 build.gradle repositories에 GitHub Packages maven { url; credentials } 추가
      #   3) 이 워크플로우에 `permissions: packages: read`와 GITHUB_TOKEN(또는 read:packages PAT)
      #      인증을 추가
      #   로 교체한다. 그러면 매번 common을 체크아웃/빌드하지 않고 버전 고정된 아티팩트를
      #   그대로 받아쓸 수 있어 빌드 시간도 줄어든다.
      # ----------------------------------------------------------------------------------
      - name: barofit-common checkout (임시 — 위 TODO 참고)
        uses: actions/checkout@v4
        with:
          repository: Barofit-team/barofit-common
          path: barofit-common

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정/캐시
        uses: gradle/actions/setup-gradle@v4

      - name: barofit-common publishToMavenLocal
        working-directory: barofit-common
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: 포맷 검사 (spotlessCheck)
        run: ./gradlew spotlessCheck --no-daemon

      - name: 단위 테스트 (test)
        run: ./gradlew test --no-daemon

      # ----------------------------------------------------------------------------------
      # 여기까지가 "최소" 범위. 아래는 다음에 추가하면 좋을 것들 — 대략 우선순위 순서.
      #
      # TODO(CICD 담당자) 확장 방향:
      #
      # 1. integrationTest 잡 추가
      #    이 레포에 src/integrationTest(Testcontainers 기반)가 있다면 `./gradlew integrationTest`를
      #    추가한다. ubuntu-latest 러너엔 Docker가 기본 설치돼 있어 Testcontainers가 별도 설정
      #    없이 바로 동작한다. 단위 테스트보다 느리므로 같은 job에 이어붙이기보다, needs:로
      #    build-and-test에 의존하는 별도 job으로 분리해 가독성 있게 관리하는 걸 권장.
      #
      # 2. 캐시 최적화
      #    gradle/actions/setup-gradle@v4가 기본으로 ~/.gradle/caches를 캐시해주지만,
      #    barofit-common을 매번 새로 체크아웃+퍼블리시하는 지금 구조에서는 캐시 효율이
      #    떨어진다. 위 GitHub Packages 전환(TODO) 이후에는 캐시 적중률이 크게 좋아질 것.
      #
      # 3. 브랜치 보호 규칙과 연동 (필수 상태 검사)
      #    barofit-team 조직의 dev 브랜치 보호 규칙(1인 승인 필수)에 이 워크플로우를
      #    "Required status check"로 등록하면, 테스트가 실패한 PR은 승인과 무관하게
      #    머지가 막힌다. 저장소 Settings → Branches → dev 규칙 편집에서 이 워크플로우의
      #    job 이름(build-and-test)을 추가하면 된다.
      #
      # 4. Docker 이미지 빌드 검증
      #    실제 EKS/ArgoCD 배포 파이프라인이 생기기 전까지는 범위 밖이지만, 최소한
      #    `docker build .`가 깨지지 않는지 정도는 이 워크플로우에 추가해볼 수 있다
      #    (barofit-infra/infra/README.md의 이미지 빌드 절차 참고).
      #
      # 5. 실패 알림
      #    Slack/Discord webhook으로 CI 실패를 알리는 스텝. 팀 규모가 작을 땐 GitHub PR
      #    상태 표시만으로 충분할 수 있어 우선순위는 낮게 둠.
      # ----------------------------------------------------------------------------------
